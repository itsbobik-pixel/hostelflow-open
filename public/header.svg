<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 320" preserveAspectRatio="xMidYMid slice">
  <!-- Header art: sunset over the sea, waves like the one in the logo. Own drawing, free to use. -->
  <style>
    .w1{animation:sway 14s ease-in-out infinite alternate}
    .w2{animation:sway 10s ease-in-out infinite alternate-reverse}
    .w3{animation:sway 8s ease-in-out infinite alternate}
    .stars circle{animation:twinkle 4s ease-in-out infinite}
    .stars circle:nth-child(3n){animation-delay:-1.3s}
    .stars circle:nth-child(3n+1){animation-delay:-2.6s}
    .glow{animation:glow 6s ease-in-out infinite alternate;transform-origin:1120px 205px}
    .glitter path{animation:twinkle 3s ease-in-out infinite}
    .glitter path:nth-child(2n){animation-delay:-1.5s}
    @keyframes sway{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
    @keyframes twinkle{50%{opacity:.25}}
    @keyframes glow{to{transform:scale(1.08);opacity:.95}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2347"/>
      <stop offset="0.45" stop-color="#7a3f63"/>
      <stop offset="0.75" stop-color="#e0755a"/>
      <stop offset="1" stop-color="#f7b267"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.55" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ffb05c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c4e86"/>
      <stop offset="1" stop-color="#26315c"/>
    </linearGradient>
    <linearGradient id="sea2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3a6e"/>
      <stop offset="1" stop-color="#18203f"/>
    </linearGradient>
    <linearGradient id="sea3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2650"/>
      <stop offset="1" stop-color="#10152c"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="320" fill="url(#sky)"/>
  <!-- stars -->
  <g class="stars" fill="#fff" opacity=".7">
    <circle cx="120" cy="40" r="1.4"/><circle cx="260" cy="22" r="1"/><circle cx="410" cy="58" r="1.2"/>
    <circle cx="590" cy="30" r="1"/><circle cx="760" cy="18" r="1.3"/><circle cx="980" cy="44" r="1"/>
    <circle cx="1150" cy="24" r="1.4"/><circle cx="1320" cy="52" r="1"/><circle cx="1490" cy="28" r="1.2"/>
  </g>
  <!-- sun -->
  <circle class="glow" cx="1120" cy="205" r="120" fill="url(#sun)" opacity=".85"/>
  <circle cx="1120" cy="205" r="46" fill="#fff0bd"/>
  <!-- far hills (a coast with a few houses) -->
  <path d="M0 212 C140 180 260 190 380 200 C520 212 600 168 760 176 C880 182 960 206 1040 212 L1600 214 L1600 240 L0 240Z" fill="#4a2f55" opacity=".85"/>
  <g fill="#ffd9a0" opacity=".9">
    <rect x="232" y="184" width="6" height="5" rx="1"/><rect x="250" y="188" width="5" height="4" rx="1"/>
    <rect x="610" y="176" width="6" height="5" rx="1"/><rect x="628" y="172" width="5" height="5" rx="1"/>
    <rect x="700" y="178" width="5" height="4" rx="1"/>
  </g>
  <!-- sea, three layers of waves -->
  <path class="w1" d="M-160 226 C-40 214 40 238 160 226 S360 214 480 226 S680 238 800 226 S1000 214 1120 226 S1320 238 1440 226 S1640 214 1760 226 L1760 320 L-160 320Z" fill="url(#sea1)"/>
  <path class="w2" d="M-180 252 C-40 238 40 266 180 252 S400 238 540 252 S760 266 900 252 S1120 238 1260 252 S1480 266 1620 252 S1700 246 1780 252 L1780 320 L-180 320Z" fill="url(#sea2)"/>
  <path class="w3" d="M-200 282 C-40 266 40 298 200 282 S440 266 600 282 S840 298 1000 282 S1240 266 1400 282 S1640 298 1800 282 L1800 320 L-200 320Z" fill="url(#sea3)"/>
  <!-- sun glitter on the water -->
  <g class="glitter" stroke="#ffd98f" stroke-linecap="round" opacity=".8">
    <path d="M1080 236h80" stroke-width="3"/><path d="M1090 248h60" stroke-width="2.5"/>
    <path d="M1100 262h40" stroke-width="2"/><path d="M1108 276h24" stroke-width="2"/>
  </g>
</svg>
